name = "TaeyoungVerification"
defaultTargets = ["Taeyoung"]

# Mathlib at the tag matching the toolchain; `lake-manifest.json` pins it to
# commit fabf563a7c95a166b8d7b6efca11c8b4dc9d911f.
[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "v4.31.0"

# The odd-cycle Goodman bound `t(C_ℓ,W) ≥ p^ℓ - p(1-p)^{ℓ-1}` and the spectral
# theory of the graphon operator, formalized by Im, Kim, and Yang alongside
# arXiv:2610.18277.  It uses the same toolchain and Mathlib commit.
[[require]]
name = "OddCycleBound"
git = "https://github.com/mekty2012/OddCycleGoodman-lean.git"
rev = "dbaea5a4d2c044a202f1e40647f4b24a1c77b313"

[[lean_lib]]
name = "Taeyoung"
# The `unusedSectionVars` linter fires on essentially every lemma here: these
# files share broad `variable` blocks, so most lemmas legitimately do not use
# every ambient instance.  Disable just that linter package-wide (all genuinely
# useful linters stay on).
leanOptions = [{name = "linter.unusedSectionVars", value = false}]
